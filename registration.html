<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="css/main.css">

</head>
<body>
    <header>
    <a href="index.html">
            <img src="src/logo_for_homepage.png" alt="Hikikomori Logo" class="logo">
            <span class="site-name">Hikikomori.lab</span>
        </a>

        <button class="burger" id="burger">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav-menu" id="nav-menu">
            <a href="index.html" class="nav-link">Home</a>
            <a href="animecollections.html" class="nav-link">Anime</a>
            <a href="mangacollections.html" class="nav-link">Manga</a>
            <a href="FAQs_page.html" class="nav-link">FAQs</a>
        </nav>

        <a href="registration.html" class="profile">
            <img src="src/profile_icon.png" alt="Profile" class="logo">
        </a>

</header>

    <main>
        <div class="responsive-title">Registration</div>
    </main>

    <footer>
<form novalidate>

    <div class="input-group mt-3">
        <input type="text" id="name" class="form-control" placeholder="Nickname">
    </div>

    <div class="input-group mt-3">
        <input type="password" id="pass" class="form-control" placeholder="Password">
    </div>

    <div class="input-group mt-3">
        <input type="password" id="pass-confirm" class="form-control" placeholder="Confirm password">
    </div>

    <div class="input-group mt-3">
        <span class="input-group-text">@</span>
        <input type="email" id="email" class="form-control" placeholder="Email" inputmode="email">
    </div>

    <div class="form-check mt-2">
        <input class="form-check-input" type="checkbox" id="agree">
        <label class="form-check-label" for="agree">
            I agree with the terms
        </label>
    </div>

    <div id="errors"></div>

    <button type="submit" class="btn btn-primary">
        Submit
    </button>

</form> 
        Aldiyar Akhtanov, Aituar Kaliyev
    </footer>
    <button id="open-contact" class="contact-button">
        Contact Us
    </button>

<div id="contact-popup" class="popup-overlay">
    <div class="popup-content">

        <h2>Contact Us</h2>
        <p>Have a question or suggestion? Send us a message!</p>

        <form id="contact-form">
            <label for="contact-name">Your Name</label>
            <input type="text" id="contact-name"
                   placeholder="Enter your name" required>

            <label for="contact-email">Your Email</label>
            <input type="email" id="contact-email" placeholder="example@email.com">

            <label for="contact-message">Message</label>
            <textarea id="contact-message" rows="4" placeholder="Write your message..." required></textarea>

            <p id="contact-status" role="status"></p>

            <div class="popup-buttons">
                <button type="button" id="cancel-contact">
                    Cancel
                </button>
                <button type="submit">
                    Send Message
                </button>
            </div>
        </form>
    </div>
</div>

    <script src="Js/main.js"></script>
</body>
</html>
