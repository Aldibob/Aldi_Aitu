<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration — Hikikomori.lab</title>
    <link rel="icon" type="image/png" sizes="64x64" href="src/logo_page.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="main-header p-0">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark w-100 px-sm-4">
            <div class="container-fluid">
                <a href="index.html" class="navbar-brand logo-container d-flex align-items-center me-4">
                    <img src="src/logo_for_homepage.png" alt="Hikikomori Logo" class="logo me-2">
                    <span class="site-name">Hikikomori.lab</span>
                </a>

                <button class="navbar-toggler" type="button"
                        data-bs-toggle="collapse" data-bs-target="#navbarNav"
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-lg-2">
                        <li class="nav-item"><a href="index.html" class="nav-link btn btn-outline-purple text-white px-3 mt-1 mt-lg-0">Home</a></li>
                        <li class="nav-item"><a href="animecollections.html" class="nav-link btn btn-outline-purple text-white px-3 mt-1 mt-lg-0">Anime Collections</a></li>
                        <li class="nav-item"><a href="FAQs_page.html" class="nav-link btn btn-outline-purple text-white px-3 mt-1 mt-lg-0">FAQ</a></li>
                    </ul>
                    <a href="registration.html" class="profile d-inline-flex align-items-center ms-lg-3 mt-2 mt-lg-0">
                        <img src="src/profile.webp" alt="Profile" class="profile-icon">
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="responsive-title">Registration</div>

        <form novalidate>
            <div class="input-group mt-3">
                <input type="text" id="name" class="form-control" placeholder="Nickname">
            </div>

            <div class="input-group mt-3">
                <input type="password" id="pass" class="form-control" placeholder="Password">
            </div>

            <div class="input-group mt-3">
                <input type="password" id="pass-confirm" class="form-control" placeholder="Confirm password">
            </div>

            <div class="input-group mt-3">
                <span class="input-group-text">@</span>
                <input type="email" id="email" class="form-control" placeholder="Email" inputmode="email">
            </div>

            <div class="form-check mt-2">
                <input class="form-check-input" type="checkbox" id="agree">
                <label class="form-check-label" for="agree">I agree with the terms</label>
            </div>

            <div id="errors"></div>

            <button type="submit" class="btn btn-primary mt-3">Submit</button>
        </form>
    </main>

    <footer>
        <p>Aldiyar Akhtanov, Aituar Kaliyev</p>
    </footer>

    <button id="open-contact" class="contact-button">Contact Us</button>

    <div id="contact-popup" class="popup-overlay">
        <div class="popup-content">
            <h2>Contact Us</h2>
            <p>Have a question or suggestion? Send us a message!</p>

            <form id="contact-form" novalidate>
                <label for="contact-name">Your Name</label>
                <input type="text" id="contact-name" placeholder="Nickname">

                <label for="contact-email">Your Email</label>
                <input type="email" id="contact-email" placeholder="example@email.com">

                <label for="contact-message">Message</label>
                <textarea id="contact-message" rows="4" placeholder="Write your message..."></textarea>

                <p id="contact-status" role="status"></p>
                <div id="errors-contact"></div>

                <div class="popup-buttons">
                    <button type="button" id="cancel-contact">Cancel</button>
                    <button type="submit">Send Message</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="Js/main.js"></script>
</body>
</html>
