<!DOCTYPE html>
<html lang="en">
    <head>  
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Anime Website</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/main.css">
    </head>
<body class="page-shell">

    <noscript>
        <p>Please enable JavaScript to view this website.</p>
    </noscript>

    <header>

        <a href="index.html">
            <img src="src/logo_for_homepage.png" alt="Hikikomori Logo" class="logo">
            <span class="site-name">Hikikomori.lab</span>
        </a>

        <button class="burger" id="burger">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="nav-menu" id="nav-menu">
            <a href="index.html" class="nav-link">Home</a>
            <a href="animecollections.html" class="nav-link">Anime</a>
            <a href="mangacollections.html" class="nav-link">Manga</a>
            <a href="FAQs_page.html" class="nav-link">FAQs</a>
        </nav>

        <a href="registration.html" class="profile">
            <img src="src/profile_icon.png" alt="Profile" class="logo">
        </a>

    </header>
        <button onclick="background_Color" class="notification-button" id="color-button">
            <div class="notification-button-text">Color</div>
        </button>

    <main>
        <div class="datetime-block">
            <h2>Current Date and Time</h2>
            <p id="datetime"></p>
        </div>
    </main>

    <footer>   
        <section class="about-us">
        <h2>About Us</h2>
        <p>
        We are two young frontend developers and anime fans.
        We created this website to share our passion for anime and manga
        while improving our web development skills.
        </p>
        </section> 
    </footer>

    <button id="open-contact" class="contact-button">
        Contact Us
    </button>

<div id="contact-popup" class="popup-overlay">
    <div class="popup-content">

        <h2>Contact Us</h2>
        <p>Have a question or suggestion? Send us a message!</p>

        <form id="contact-form">
            <label for="contact-name">Your Name</label>
            <input type="text" id="contact-name"placeholder="Nickname">

            <label for="contact-email">Your Email</label>
            <input type="email" id="contact-email" placeholder="example@email.com">

            <label for="contact-message">Message</label>
            <textarea id="contact-message" rows="4" placeholder="Write your message..."></textarea>

            <p id="contact-status" role="status"></p>

            <div class="popup-buttons">
                <button type="button" id="cancel-contact">
                    Cancel
                </button>
                <button type="submit">
                    Send Message
                </button>
            </div>
        </form>
    </div>
</div>
        <script src="Js/main.js"></script>
    </body>
</html>
